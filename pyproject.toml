[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot"
version = "0.1.0"
description = "Local LLM-powered e-commerce data analysis and anomaly detection Agent"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2.0",
    "langchain-ollama>=1.1,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "pandas>=3.1,<4.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "sqlalchemy[asyncio]>=2.1,<3.0",
    "aiosqlite>=0.22,<1.0",
    "fastapi>=0.163,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "httpx>=0.28,<1.0",
    "mcp>=2.3,<3.0",
    "python-multipart>=0.0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-asyncio>=1.5,<2.0",
    "ruff>=0.17,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
