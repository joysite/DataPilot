services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATAPILOT_DATABASE_URL: ${DATAPILOT_DATABASE_URL:-sqlite+aiosqlite:////app/data/datapilot.db}
      DATAPILOT_CHECKPOINTER_PATH: ${DATAPILOT_CHECKPOINTER_PATH:-/app/data/checkpointer.db}
      DATAPILOT_OLLAMA_BASE_URL: ${DATAPILOT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATAPILOT_OLLAMA_MODEL: ${DATAPILOT_OLLAMA_MODEL:-qwen2.5-coder:7b}
      DATAPILOT_OLLAMA_TEMPERATURE: ${DATAPILOT_OLLAMA_TEMPERATURE:-0.0}
    volumes:
      - datapilot_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATAPILOT_WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datapilot_data:
    name: datapilot_data
